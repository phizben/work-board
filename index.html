<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Board</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #F0F2F5; color: #172B4D;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* ── HEADER ── */
.header {
  background: #fff; border-bottom: 1px solid #DFE1E6;
  padding: 0 20px; height: 52px; display: flex;
  align-items: center; justify-content: space-between; flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 28px; height: 28px; background: #0052CC; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.header-title { font-size: 16px; font-weight: 600; }
.header-date  { font-size: 12px; color: #6B778C; }
.header-right { display: flex; align-items: center; gap: 10px; }
.toggle-label {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: #6B778C; cursor: pointer; user-select: none;
}
.toggle-label input { cursor: pointer; accent-color: #0052CC; }
.btn-header {
  background: #F4F5F7; border: 1px solid #DFE1E6; border-radius: 4px;
  padding: 5px 10px; font-size: 12px; color: #5E6C84; cursor: pointer; font-family: inherit;
}
.btn-header:hover { background: #EBECF0; }

/* ── LAYOUT ── */
.board { display: flex; flex: 1; overflow: hidden; }
.panel { display: flex; flex-direction: column; overflow: hidden; padding: 14px 0 14px 14px; }
.panel-left  { flex: 0 0 57%; border-right: 2px solid #DFE1E6; }
.panel-right { flex: 1; }
.panel-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; padding-right: 14px; flex-shrink: 0;
}
.panel-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-blue   { background: #0052CC; }
.dot-purple { background: #6554C0; }
.panel-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6B778C; }

/* ── TRACK ── */
.track {
  display: flex; gap: 10px; overflow-x: auto;
  padding-bottom: 10px; flex: 1; align-items: flex-start; padding-right: 14px;
}
.track::-webkit-scrollbar { height: 5px; }
.track::-webkit-scrollbar-thumb { background: #C1C7D0; border-radius: 3px; }

/* ── COLUMN ── */
.col {
  background: #F4F5F7; border-radius: 8px; padding: 10px 8px;
  display: flex; flex-direction: column; gap: 5px;
  max-height: calc(100vh - 118px); overflow-y: auto; transition: background .1s;
}
.panel-left  .col { flex: 0 0 200px; }
.panel-right .col { flex: 0 0 178px; }
.col::-webkit-scrollbar { width: 3px; }
.col::-webkit-scrollbar-thumb { background: #C1C7D0; border-radius: 2px; }
.col.drag-over { background: #E6EFFF; }
.col.dragging-opacity { opacity: 0.4; }
.col-header { cursor: grab; }
.col-header:active { cursor: grabbing; }
.col.collapsed .card, .col.collapsed .btn-add, .col.collapsed .item-wrapper { display: none; }
.col.collapsed .col-chevron { color: #5E6C84; }
.col-header {
  font-size: 12px; font-weight: 700; color: #5E6C84; letter-spacing: .04em;
  padding: 2px 4px 6px; display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.col-title  { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-count  { font-size: 11px; color: #97A0AF; font-weight: 400; }
.col-chevron {
  background: none; border: none; cursor: pointer;
  color: #C1C7D0; font-size: 10px; padding: 1px 0 1px 4px; line-height: 1; font-family: inherit; flex-shrink: 0;
}
.col-chevron:hover { color: #5E6C84; }
.person-chip {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff;
}

/* ── ITEM WRAPPER ── */
.item-wrapper { display: flex; flex-direction: column; flex-shrink: 0; }

/* ── CARD (shared base) ── */
.card {
  background: #fff; border-radius: 6px; padding: 7px 9px;
  font-size: 12.5px; line-height: 1.4; color: #172B4D;
  box-shadow: 0 1px 3px rgba(9,30,66,.10), 0 0 0 1px rgba(9,30,66,.04);
  border-left: 3px solid transparent; position: relative;
  transition: box-shadow .12s; word-break: break-word; flex-shrink: 0;
  display: flex; align-items: flex-start; gap: 5px;
}
.card:hover { box-shadow: 0 3px 8px rgba(9,30,66,.14), 0 0 0 1px rgba(9,30,66,.08); }
.card.urgent  { border-left-color: #FF5630; }
.card.done    { opacity: .42; }
.card.done .card-text { text-decoration: line-through; }
.card.editing { box-shadow: 0 0 0 2px #4C9AFF; }

/* ── DEPTH STYLES ── */
.card.d0 {
  background: #EBF2FF; border-left-color: #0052CC;
  font-weight: 600; font-size: 12.5px;
}
.card.d0.urgent { border-left-color: #FF5630; }
.panel-right .card.d0 { background: #F0EEFF; border-left-color: #6554C0; }
.panel-right .card.d0.urgent { border-left-color: #FF5630; }

.card.d1 { background: #fff; }
.card.d2 { background: #FAFBFC; font-size: 12px; padding: 5px 8px; }

/* ── EXPAND BUTTON ── */
.item-expand {
  background: none; border: none; cursor: pointer; color: #97A0AF;
  font-size: 10px; padding: 1px 2px; line-height: 1; font-family: inherit;
  flex-shrink: 0; margin-top: 2px; white-space: nowrap;
}
.item-expand:hover { color: #5E6C84; }

/* ── ITEM BODY ── */
.item-body { flex: 1; min-width: 0; }
.card-text {
  display: block; white-space: pre-wrap; outline: none; min-height: 1em;
}
.card-owner {
  display: inline-block; margin-top: 4px;
  font-size: 10px; font-weight: 600; color: #6B778C;
  background: rgba(9,30,66,.06); border-radius: 3px; padding: 1px 5px;
}
.type-badge {
  display: inline-flex; align-items: center;
  font-size: 10px; font-weight: 600; letter-spacing: .02em;
  border-radius: 3px; padding: 1px 6px; margin-top: 4px; margin-left: 3px;
  cursor: pointer; user-select: none; transition: opacity .12s;
}
.type-badge:hover { opacity: .7; }
.type-badge.todo    { background: #DEEBFF; color: #0052CC; }
.type-badge.monitor { background: #FFF0B3; color: #974F0C; }

/* ── HOVER ACTIONS ── */
.card-actions {
  display: none; gap: 3px; align-items: center;
  margin-top: 5px; flex-wrap: wrap;
}
.card:hover .card-actions,
.card.editing .card-actions { display: flex; }
.act {
  width: 20px; height: 20px; border: none; border-radius: 3px; cursor: pointer;
  font-size: 11px; font-weight: 700; display: flex; align-items: center;
  justify-content: center; font-family: inherit; line-height: 1;
  background: rgba(255,255,255,.92); color: #6B778C; flex-shrink: 0;
}
.act:hover        { background: #EBECF0; color: #172B4D; }
.act.urgent       { color: #FF5630; }
.act.urgent:hover { background: #FFEBE6; }
.act.done         { color: #36B37E; }
.act.done:hover   { background: #E3FCEF; }
.act.del:hover    { background: #FFEBE6; color: #FF5630; }
.act.move         { color: #5E6C84; font-size: 13px; }
.act.move:hover   { background: #DEEBFF; color: #0052CC; }
.act.unnest:hover { background: #E3FCEF; color: #006644; }

/* ── CHILDREN ── */
.children {
  margin-left: 8px; margin-top: 3px;
  border-left: 2px solid #DFE1E6; padding-left: 10px;
  display: flex; flex-direction: column; gap: 4px;
}

/* ── ADD BUTTONS ── */
.btn-add, .btn-add-child {
  background: none; border: none; cursor: pointer;
  color: #97A0AF; padding: 4px 6px; border-radius: 4px;
  text-align: left; width: 100%; font-family: inherit; flex-shrink: 0;
  display: flex; align-items: center; gap: 4px;
}
.btn-add       { font-size: 12px; }
.btn-add-child { font-size: 11px; }
.btn-add:hover, .btn-add-child:hover { background: rgba(9,30,66,.06); color: #5E6C84; }

/* ── ADD COLUMN BUTTON ── */
.btn-add-col {
  flex: 0 0 auto; align-self: flex-start;
  background: none; border: 2px dashed #C1C7D0; border-radius: 8px;
  cursor: pointer; color: #97A0AF; padding: 8px 14px;
  font-family: inherit; font-size: 12px; white-space: nowrap;
  transition: background .1s, border-color .1s, color .1s;
}
.btn-add-col:hover { background: #E6EFFF; border-color: #4C9AFF; color: #0052CC; }

/* ── COLUMN HEADER ACTIONS ── */
.col-header-acts { display: none; gap: 2px; align-items: center; margin-left: 4px; }
.col:hover .col-header-acts { display: flex; }
.col:hover .col-count { display: none; }
.col-act {
  width: 18px; height: 18px; border: none; border-radius: 3px; cursor: pointer;
  font-size: 11px; font-weight: 700; display: flex; align-items: center;
  justify-content: center; font-family: inherit; line-height: 1;
  background: transparent; color: #97A0AF;
}
.col-act:hover       { background: #EBECF0; color: #172B4D; }
.col-act.col-del:hover  { background: #FFEBE6; color: #FF5630; }
.col-act.col-move    { font-size: 13px; }
.col-act.col-move:hover { background: #DEEBFF; color: #0052CC; }

/* ── CARD DRAG ── */
.card.card-dragging  { opacity: 0.35; }
.card.drop-before    { border-top: 2px solid #4C9AFF !important; }
.card.drop-after     { border-bottom: 2px solid #4C9AFF !important; }
.card.drop-inside    { box-shadow: 0 0 0 2px #4C9AFF !important; }

/* ── DRAG HANDLE ── */
.col-drag-handle {
  color: #C1C7D0; font-size: 13px; cursor: grab; flex-shrink: 0;
  line-height: 1; user-select: none; padding: 0 2px;
}
.col:hover .col-drag-handle { color: #97A0AF; }

/* ── SAVED TOAST ── */
#saved-toast {
  position: fixed; bottom: 20px; right: 20px;
  background: #36B37E; color: #fff;
  font-size: 12px; font-weight: 600; letter-spacing: .02em;
  padding: 6px 14px; border-radius: 20px;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9999;
}
#saved-toast.show { opacity: 1; }

/* ── PANEL TOGGLE ── */
.panel-tabs {
  display: flex; gap: 4px;
}
.panel-tab {
  padding: 5px 12px; font-size: 12px; font-weight: 600; font-family: inherit;
  border: 1px solid #DFE1E6; border-radius: 4px; cursor: pointer;
  background: #F4F5F7; color: #6B778C; transition: background .1s, color .1s;
}
.panel-tab.active { background: #0052CC; color: #fff; border-color: #0052CC; }
.panel-tab:not(.active):hover { background: #EBECF0; }
.panel.hidden { display: none; }
.panel-left.full,
.panel-right.full { flex: 1; border-right: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">W</div>
    <span class="header-title">Work Board</span>
    <span class="header-date" id="hdr-date"></span>
  </div>
  <div class="header-right">
    <div class="panel-tabs">
      <button class="panel-tab active" id="tab-myAreas" onclick="switchPanel('myAreas')">My Areas</button>
      <button class="panel-tab" id="tab-syncAgendas" onclick="switchPanel('syncAgendas')">Sync Agendas</button>
      <button class="panel-tab" id="tab-both" onclick="switchPanel('both')">Both</button>
    </div>
    <label class="toggle-label"><input type="checkbox" id="toggle-done" checked> Show done</label>
    <button class="btn-header" onclick="exportJSON()">Export JSON</button>
    <button class="btn-header" onclick="resetBoard()" style="color:#FF5630">Reset</button>
  </div>
</div>

<div class="board">
  <div class="panel panel-left">
    <div class="panel-header">
      <div class="panel-dot dot-blue"></div>
      <span class="panel-label">My Areas</span>
    </div>
    <div class="track" id="track-myAreas"></div>
  </div>
  <div class="panel panel-right">
    <div class="panel-header">
      <div class="panel-dot dot-purple"></div>
      <span class="panel-label">Sync Agendas</span>
    </div>
    <div class="track" id="track-syncAgendas"></div>
  </div>
</div>

<script>
// ── HELPERS ───────────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function levelLabel(panelKey, depth) {
  return (panelKey === 'myAreas'
    ? ['Initiative','Project','Task']
    : ['Party','Project','Task'])[depth];
}
const MAX_DEPTH = 2;

// ── ITEM FACTORY ──────────────────────────────────────────────────────────────
function mkItem(text, opts) {
  return Object.assign({ id:uid(), text:text||'', owner:'', urgent:false, done:false, type:'todo', expanded:false, children:[] }, opts);
}

// ── DEFAULT DATA ──────────────────────────────────────────────────────────────
function defaultState() {

        mkItem('Platformize',       {owner:'Yogev',  type:'monitor'}),

        mkItem('Storage',           {owner:'Ziv',    type:'monitor'}),
        mkItem('B2B',               {owner:'Yogev',  type:'monitor'}),
        mkItem('Site management suite', {owner:'David', type:'monitor'}),
        mkItem('Autopoint',         {owner:'Yogev',  type:'monitor'}),
        mkItem('RPC',               {urgent:true}),
      ]},

        mkItem('Agent with Claude co-work'),
      ]},
    ],
    syncAgendas: [
      { id:'jack',   title:'Jack',   initials:'JK', color:'#0052CC', collapsed:false, cards:[
        mkItem('Network meetings (weekly)', {children:[
          mkItem('Relay'), mkItem('Acceleration')
        ]}),
        mkItem('AI adoption plan'),

      ]},
      { id:'jacob',  title:'Jacob',  initials:'JC', color:'#36B37E', collapsed:false, cards:[

        ]}),
        mkItem('Stock & training', {children:[
          mkItem('Storage analysis — post results (Dveer, Guy)'),
          mkItem('Training — help Precilla, review materials'),
          mkItem('Commissioning — storage limitation'),

        ]}),
        mkItem('Other', {children:[
          mkItem('Schwartz group — present to Jack'),

        ]}),
      ]},
      { id:'yogev',  title:'Yogev',  initials:'YG', color:'#FF8B00', collapsed:false, cards:[
        mkItem('DD-related features',            {urgent:true}),
        mkItem('B2B site design & op model',     {urgent:true}),

        ]}),
        mkItem('Flow — agree on tools needed'),
      ]},
      { id:'ziv',    title:'Ziv',    initials:'ZV', color:'#00B8D9', collapsed:false, cards:[
        mkItem('DD', {children:[
          mkItem('PTT + Daily deals'),

          mkItem('Op model sessions — record'),

        ]}),
        mkItem('Efficiency racking (Ori leads)', {type:'monitor'}),
        mkItem('Storage — bin type selection algo', {type:'monitor'}),
      ]},
      { id:'hodaya', title:'Hodaya', initials:'HD', color:'#FF5630', collapsed:false, cards:[
        mkItem('How are things going?'),
        mkItem('Update & re-sign all consultant contracts'),
        mkItem('Maya as part-time consultant?'),
      ]},
      { id:'shalom', title:'Shalom', initials:'SH', color:'#403294', collapsed:false, cards:[
        mkItem('DD performance simulation',                      {urgent:true}),
        mkItem('Robustness / station utilization for on-demand', {urgent:true}),

}

// ── STATE ─────────────────────────────────────────────────────────────────────
const LS = 'workboard_v2';
let state = (() => {
  try { const r = localStorage.getItem(LS); return r ? JSON.parse(r) : defaultState(); }
  catch { return defaultState(); }
})();
let showDone = true;
let _dragPanel = null;
let _dragColId = null;
let _lastState = null;
let _cardDrag = null;      // { p, cId, itemId }
let _dropTargetId = null;
let _dropPosition = null;  // 'before' | 'after' | 'inside'
let _toastTimer = null;

function showSaved(msg) {
  const t = document.getElementById('saved-toast');
  if (!t) return;
  t.textContent = msg || '✓ Saved';
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

function save() {
  const prev = localStorage.getItem(LS);
  if (prev) _lastState = prev;
  localStorage.setItem(LS, JSON.stringify(state));
  showSaved();
}

function undoLast() {
  if (!_lastState) return;
  state = JSON.parse(_lastState);
  _lastState = null;
  localStorage.setItem(LS, JSON.stringify(state));
  renderAll();
  showSaved('↩ Undone');
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
    e.preventDefault(); undoLast();
  }
});
function resetBoard() {
  if (!confirm('Reset board to default data? This cannot be undone.')) return;
  state = defaultState(); save(); renderAll();
}

// ── LOOKUPS ───────────────────────────────────────────────────────────────────
function col(p, cId) { return state[p]?.find(c => c.id === cId); }

function findItem(items, id) {
  for (const it of items) {
    if (it.id === id) return it;
    if (it.children?.length) { const f = findItem(it.children, id); if (f) return f; }
  }
  return null;
}

function removeItem(items, id) {
  const i = items.findIndex(x => x.id === id);
  if (i !== -1) { items.splice(i, 1); return true; }
  return items.some(it => it.children && removeItem(it.children, id));
}

function colFindItem(p, cId, id) {
  const c = col(p, cId); return c ? findItem(c.cards, id) : null;
}

function findWithParent(items, id) {
  for (let i = 0; i < items.length; i++) {
    if (items[i].id === id) return { item: items[i], arr: items, index: i };
    if (items[i].children?.length) {
      const r = findWithParent(items[i].children, id);
      if (r) return r;
    }
  }
  return null;
}

// Returns array of { arr, index, item } from root down to the target
function findPath(items, id, path = []) {
  for (let i = 0; i < items.length; i++) {
    const step = { arr: items, index: i, item: items[i] };
    if (items[i].id === id) return [...path, step];
    if (items[i].children?.length) {
      const r = findPath(items[i].children, id, [...path, step]);
      if (r) return r;
    }
  }
  return null;
}

function unNestItem(p, cId, itemId) {
  const cards = col(p, cId)?.cards; if (!cards) return;
  const path = findPath(cards, itemId);
  if (!path || path.length < 2) return;           // already top-level
  const self   = path[path.length - 1];
  const parent = path[path.length - 2];
  self.arr.splice(self.index, 1);                 // remove from current parent
  const parentIdx = parent.arr.findIndex(x => x.id === parent.item.id);
  parent.arr.splice(parentIdx + 1, 0, self.item); // insert after parent
  save(); renderPanel(p);
}

function moveCardTo(p, cId, dragId, targetId, position) {
  const cards = col(p, cId)?.cards; if (!cards) return;
  const src = findWithParent(cards, dragId); if (!src) return;
  if (position === 'inside') {
    const tgtItem = findItem(cards, targetId); if (!tgtItem) return;
    src.arr.splice(src.index, 1);
    if (!tgtItem.children) tgtItem.children = [];
    tgtItem.children.unshift(src.item);
    tgtItem.expanded = true;
  } else {
    src.arr.splice(src.index, 1);                             // remove first
    const tgt = findWithParent(cards, targetId); if (!tgt) return; // re-find (index may shift)
    const at = position === 'before' ? tgt.index : tgt.index + 1;
    tgt.arr.splice(at, 0, src.item);
  }
  save(); renderPanel(p);
}

// ── MUTATIONS ─────────────────────────────────────────────────────────────────
function addTopLevel(p, cId) {
  const c = col(p, cId); if (!c) return;
  const item = mkItem(); c.cards.push(item); save(); reRenderCol(p, cId);
  requestAnimationFrame(() => focusText(item.id));
}

function addChild(p, cId, parentId) {
  const parent = colFindItem(p, cId, parentId); if (!parent) return;
  if (!parent.children) parent.children = [];
  const item = mkItem(); parent.children.push(item);
  parent.expanded = true; save(); reRenderCol(p, cId);
  requestAnimationFrame(() => focusText(item.id));
}

function deleteItem(p, cId, id) {
  const c = col(p, cId); if (!c) return;
  removeItem(c.cards, id); save(); reRenderCol(p, cId);
}

function toggleExpand(p, cId, id) {
  const item = colFindItem(p, cId, id); if (!item) return;
  item.expanded = !item.expanded; save(); reRenderCol(p, cId);
}

function toggleDone(p, cId, id) {
  const item = colFindItem(p, cId, id); if (!item) return;
  item.done = !item.done; save(); reRenderCol(p, cId);
}

function toggleUrgent(p, cId, id) {
  const item = colFindItem(p, cId, id); if (!item) return;
  item.urgent = !item.urgent; save(); reRenderCol(p, cId);
}

function toggleType(p, cId, id) {
  const item = colFindItem(p, cId, id); if (!item) return;
  item.type = (item.type||'todo') === 'todo' ? 'monitor' : 'todo'; save();
  const badge = document.querySelector('#card-'+id+' .type-badge');
  if (badge) { badge.className='type-badge '+item.type; badge.textContent=item.type==='monitor'?'Monitor':'To Do'; }
}

function moveUp(p, cId, id) {
  const c = col(p, cId); if (!c) return;
  const i = c.cards.findIndex(x => x.id === id);
  if (i <= 0) return;
  [c.cards[i-1], c.cards[i]] = [c.cards[i], c.cards[i-1]];
  save(); reRenderCol(p, cId);
}
function moveDown(p, cId, id) {
  const c = col(p, cId); if (!c) return;
  const i = c.cards.findIndex(x => x.id === id);
  if (i < 0 || i >= c.cards.length-1) return;
  [c.cards[i], c.cards[i+1]] = [c.cards[i+1], c.cards[i]];
  save(); reRenderCol(p, cId);
}

function toggleCollapse(p, cId) {
  const c = col(p, cId); if (!c) return;
  c.collapsed = !c.collapsed; save(); reRenderCol(p, cId);
}

function deleteCol(p, cId) {
  if (!confirm('Delete this entire column and all its contents?')) return;
  state[p] = state[p].filter(c => c.id !== cId);
  save(); renderPanel(p);
}

function moveColLeft(p, cId) {
  const arr = state[p];
  const i = arr.findIndex(c => c.id === cId);
  if (i <= 0) return;
  [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
  save(); renderPanel(p);
}

function moveColRight(p, cId) {
  const arr = state[p];
  const i = arr.findIndex(c => c.id === cId);
  if (i < 0 || i >= arr.length - 1) return;
  [arr[i], arr[i+1]] = [arr[i+1], arr[i]];
  save(); renderPanel(p);
}

function addCol(p) {
  const title = prompt((p === 'myAreas' ? 'Initiative' : 'Party') + ' name:');
  if (!title || !title.trim()) return;
  const newCol = { id: uid(), title: title.trim(), collapsed: false, cards: [] };
  if (p === 'syncAgendas') {
    const initials = title.trim().split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
    const colors = ['#0052CC','#36B37E','#FF8B00','#6554C0','#00B8D9','#FF5630','#403294','#00875A'];
    newCol.initials = initials || '?';
    newCol.color = colors[state[p].length % colors.length];
  }
  state[p].push(newCol);
  save(); renderPanel(p);
}

function commitText(p, cId, id, raw) {
  const text = raw.trim();
  if (!text) { deleteItem(p, cId, id); return; }
  const item = colFindItem(p, cId, id); if (!item) return;
  item.text = text; save();
}

// ── EDIT ──────────────────────────────────────────────────────────────────────
function focusText(id) {
  const el = document.getElementById('ct-'+id); if (el) startEdit(el);
}
function startEdit(el) {
  el.contentEditable = 'true'; el.focus();
  el.closest('.card').classList.add('editing');
  const r = document.createRange(), s = window.getSelection();
  r.selectNodeContents(el); r.collapse(false); s.removeAllRanges(); s.addRange(r);
}
function stopEdit(el) {
  el.contentEditable = 'false'; el.closest('.card')?.classList.remove('editing');
}

// ── BUILD ITEM (recursive) ────────────────────────────────────────────────────
function buildItem(p, cId, item, depth) {
  const wrapper = document.createElement('div');
  wrapper.className = 'item-wrapper';

  // Card
  const div = document.createElement('div');
  div.className = 'card d'+depth + (item.urgent?' urgent':'') + (item.done?' done':'');
  div.id = 'card-'+item.id;
  if (!showDone && item.done) div.style.display = 'none';

  // Card drag-and-drop
  div.setAttribute('draggable', 'true');
  div.addEventListener('dragstart', e => {
    e.stopPropagation();
    _cardDrag = { p, cId, itemId: item.id };
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => div.classList.add('card-dragging'), 0);
  });
  div.addEventListener('dragend', () => {
    div.classList.remove('card-dragging');
    document.querySelectorAll('.card.drop-before,.card.drop-after,.card.drop-inside')
      .forEach(el => el.classList.remove('drop-before','drop-after','drop-inside'));
    _cardDrag = null; _dropTargetId = null; _dropPosition = null;
  });
  div.addEventListener('dragover', e => {
    if (!_cardDrag || _cardDrag.p !== p || _cardDrag.cId !== cId) return;
    if (_cardDrag.itemId === item.id) return;
    e.preventDefault(); e.stopPropagation();
    document.querySelectorAll('.card.drop-before,.card.drop-after,.card.drop-inside')
      .forEach(el => el.classList.remove('drop-before','drop-after','drop-inside'));
    const rect = div.getBoundingClientRect();
    const ratio = (e.clientY - rect.top) / rect.height;
    if (depth < MAX_DEPTH && ratio > 0.3 && ratio < 0.7) {
      div.classList.add('drop-inside'); _dropPosition = 'inside';
    } else if (ratio < 0.5) {
      div.classList.add('drop-before'); _dropPosition = 'before';
    } else {
      div.classList.add('drop-after');  _dropPosition = 'after';
    }
    _dropTargetId = item.id;
  });
  div.addEventListener('dragleave', e => {
    if (!div.contains(e.relatedTarget))
      div.classList.remove('drop-before','drop-after','drop-inside');
  });
  div.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    div.classList.remove('drop-before','drop-after','drop-inside');
    if (!_cardDrag || !_dropTargetId || !_dropPosition) return;
    if (_cardDrag.itemId === item.id) return;
    moveCardTo(_cardDrag.p, _cardDrag.cId, _cardDrag.itemId, _dropTargetId, _dropPosition);
    _cardDrag = null; _dropTargetId = null; _dropPosition = null;
  });

  // Expand toggle (depth 0 and 1 only)
  if (depth < MAX_DEPTH) {
    const xBtn = document.createElement('button');
    xBtn.className = 'item-expand';
    const childCount = (item.children || []).length;
    xBtn.textContent = item.expanded ? '▾' : (childCount ? `▸${childCount}` : '▸');
    xBtn.title = item.expanded ? 'Collapse' : (childCount ? `Expand (${childCount} items)` : 'Expand');
    xBtn.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); toggleExpand(p, cId, item.id); });
    div.appendChild(xBtn);
  }

  // Body
  const body = document.createElement('div'); body.className = 'item-body';

  const textEl = document.createElement('div');
  textEl.className = 'card-text'; textEl.id = 'ct-'+item.id;
  textEl.textContent = item.text; textEl.contentEditable = 'false';
  textEl.addEventListener('click', e => { if (textEl.contentEditable !== 'true') { startEdit(textEl); e.stopPropagation(); } });
  textEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') { textEl.textContent = item.text; textEl.blur(); }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); textEl.blur(); }
  });
  textEl.addEventListener('blur', () => { stopEdit(textEl); commitText(p, cId, item.id, textEl.textContent); });
  body.appendChild(textEl);

  if (item.owner) {
    const own = document.createElement('span'); own.className = 'card-owner'; own.textContent = item.owner;
    body.appendChild(own);
  }

  const type = item.type || 'todo';
  const badge = document.createElement('span');
  badge.className = 'type-badge '+type;
  badge.textContent = type === 'monitor' ? 'Monitor' : 'To Do';
  badge.addEventListener('click', e => { e.stopPropagation(); toggleType(p, cId, item.id); });
  body.appendChild(badge);

  // Hover actions (inside body so they flow below text, not over it)
  const acts = document.createElement('div'); acts.className = 'card-actions';

  if (depth === 0) {
    const lb = document.createElement('button'); lb.className='act move'; lb.title='Move left'; lb.textContent='←';
    lb.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); moveUp(p,cId,item.id); });
    acts.appendChild(lb);
    const rb = document.createElement('button'); rb.className='act move'; rb.title='Move right'; rb.textContent='→';
    rb.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); moveDown(p,cId,item.id); });
    acts.appendChild(rb);
  }

  if (depth > 0) {
    const unb = document.createElement('button'); unb.className='act unnest'; unb.title='Un-nest (move up one level)'; unb.textContent='↖';
    unb.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); unNestItem(p,cId,item.id); });
    acts.appendChild(unb);
  }

  const ub = document.createElement('button'); ub.className='act urgent'; ub.title='Toggle urgent'; ub.textContent='!';
  ub.style.opacity = item.urgent ? '1' : '';
  ub.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); toggleUrgent(p,cId,item.id); });
  acts.appendChild(ub);

  const db = document.createElement('button'); db.className='act done'; db.title='Toggle done'; db.textContent='✓';
  db.style.opacity = item.done ? '1' : '';
  db.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); toggleDone(p,cId,item.id); });
  acts.appendChild(db);

  const xb = document.createElement('button'); xb.className='act del'; xb.title='Delete'; xb.textContent='×';
  xb.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); deleteItem(p,cId,item.id); });
  acts.appendChild(xb);

  body.appendChild(acts);
  div.appendChild(body);
  wrapper.appendChild(div);

  // Children section (when expanded)
  if (depth < MAX_DEPTH && item.expanded) {
    const childrenEl = document.createElement('div');
    childrenEl.className = 'children';
    (item.children || []).forEach(child => childrenEl.appendChild(buildItem(p, cId, child, depth+1)));

    const addBtn = document.createElement('button');
    addBtn.className = 'btn-add-child';
    addBtn.innerHTML = '＋ ' + levelLabel(p, depth+1);
    addBtn.addEventListener('click', () => addChild(p, cId, item.id));
    childrenEl.appendChild(addBtn);

    wrapper.appendChild(childrenEl);
  }

  return wrapper;
}

// ── BUILD COLUMN ──────────────────────────────────────────────────────────────
function buildCol(p, c) {
  const div = document.createElement('div');
  div.className = 'col' + (c.collapsed ? ' collapsed' : '');
  div.id = 'col-'+c.id;
  div.addEventListener('dragover', e => {
    if (_cardDrag) return;          // card drag in progress — ignore column drop
    if (_dragPanel !== p) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    div.classList.add('drag-over');
  });
  div.addEventListener('dragleave', e => {
    if (!div.contains(e.relatedTarget)) div.classList.remove('drag-over');
  });
  div.addEventListener('drop', e => {
    if (_cardDrag) return;
    e.preventDefault();
    div.classList.remove('drag-over');
    if (_dragPanel !== p || _dragColId === c.id) return;
    const arr = state[p];
    const from = arr.findIndex(x => x.id === _dragColId);
    const to   = arr.findIndex(x => x.id === c.id);
    if (from === -1 || to === -1) return;
    arr.splice(to, 0, arr.splice(from, 1)[0]);
    save(); renderPanel(p);
  });

  // Header — draggable for column reordering
  const hdr = document.createElement('div'); hdr.className = 'col-header';
  hdr.setAttribute('draggable', 'true');
  hdr.addEventListener('dragstart', e => {
    _dragPanel = p; _dragColId = c.id;
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
    setTimeout(() => div.classList.add('dragging-opacity'), 0);
  });
  hdr.addEventListener('dragend', () => {
    div.classList.remove('dragging-opacity');
    document.querySelectorAll('.col.drag-over').forEach(el => el.classList.remove('drag-over'));
    _dragPanel = null; _dragColId = null;
  });
  if (c.initials) {
    const chip = document.createElement('span'); chip.className='person-chip';
    chip.style.background = c.color||'#97A0AF'; chip.textContent=c.initials;
    hdr.appendChild(chip);
  }
  const dragHandle = document.createElement('span'); dragHandle.className = 'col-drag-handle'; dragHandle.textContent = '⠿'; dragHandle.title = 'Drag to reorder';
  hdr.appendChild(dragHandle);
  const titleEl = document.createElement('span'); titleEl.className = 'col-title'; titleEl.textContent = c.title; hdr.appendChild(titleEl);
  const countEl = document.createElement('span'); countEl.className='col-count';
  countEl.textContent = c.cards.length; hdr.appendChild(countEl);

  const hdrActs = document.createElement('div'); hdrActs.className = 'col-header-acts';
  const delBtn = document.createElement('button'); delBtn.className='col-act col-del'; delBtn.title='Delete column'; delBtn.textContent='×';
  delBtn.addEventListener('click', e => { e.stopPropagation(); deleteCol(p, c.id); });
  hdrActs.appendChild(delBtn);
  hdr.appendChild(hdrActs);

  const chevron = document.createElement('button'); chevron.className='col-chevron';
  chevron.textContent = c.collapsed ? '▸' : '▾'; chevron.title = 'Collapse / expand';
  chevron.addEventListener('click', e => { e.stopPropagation(); toggleCollapse(p, c.id); });
  hdr.appendChild(chevron);
  hdr.addEventListener('dblclick', e => { if (e.target.tagName !== 'BUTTON') toggleCollapse(p, c.id); });
  div.appendChild(hdr);

  if (!c.collapsed) {
    c.cards.forEach(item => div.appendChild(buildItem(p, c.id, item, 0)));

    const addBtn = document.createElement('button'); addBtn.className='btn-add';
    addBtn.innerHTML = '＋ ' + levelLabel(p, 0);
    addBtn.addEventListener('click', () => addTopLevel(p, c.id));
    div.appendChild(addBtn);
  }

  return div;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function reRenderCol(p, cId) {
  const c = col(p, cId); if (!c) return;
  const track = document.getElementById('track-'+p);
  const old   = document.getElementById('col-'+cId);
  const fresh = buildCol(p, c);
  if (old) track.replaceChild(fresh, old); else track.appendChild(fresh);
}

function renderPanel(p) {
  const track = document.getElementById('track-'+p);
  track.innerHTML = '';
  (state[p]||[]).forEach(c => track.appendChild(buildCol(p, c)));
  const addColBtn = document.createElement('button');
  addColBtn.className = 'btn-add-col';
  addColBtn.textContent = '＋ ' + (p === 'myAreas' ? 'Initiative' : 'Party');
  addColBtn.addEventListener('click', () => addCol(p));
  track.appendChild(addColBtn);
}

function renderAll() {
  renderPanel('myAreas');
  renderPanel('syncAgendas');
}

// ── PANEL TOGGLE ──────────────────────────────────────────────────────────────
let _activePanel = 'myAreas';
function switchPanel(which) {
  _activePanel = which;
  const left  = document.querySelector('.panel-left');
  const right = document.querySelector('.panel-right');
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + (which === 'both' ? 'both' : which)).classList.add('active');
  if (which === 'both') {
    left.classList.remove('hidden', 'full');
    right.classList.remove('hidden', 'full');
    left.style.flex = '';
  } else if (which === 'myAreas') {
    left.classList.remove('hidden'); left.classList.add('full');
    right.classList.add('hidden'); right.classList.remove('full');
  } else {
    right.classList.remove('hidden'); right.classList.add('full');
    left.classList.add('hidden'); left.classList.remove('full');
  }
}

// ── EXPORT ────────────────────────────────────────────────────────────────────
function exportJSON() {
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = Object.assign(document.createElement('a'), {href:URL.createObjectURL(blob), download:'workboard.json'});
  a.click(); URL.revokeObjectURL(a.href);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.getElementById('hdr-date').textContent = new Date().toLocaleDateString('en-US', {
  weekday:'short', year:'numeric', month:'short', day:'numeric'
});
document.getElementById('toggle-done').addEventListener('change', function() {
  showDone = this.checked; renderAll();
});
renderAll();
</script>
<div id="saved-toast">✓ Saved</div>
</body>
