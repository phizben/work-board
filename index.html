<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Board</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #F0F2F5;
  color: #172B4D;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
.header {
  background: #fff; border-bottom: 1px solid #DFE1E6;
  padding: 0 20px; height: 52px; display: flex;
  align-items: center; justify-content: space-between;
  flex-shrink: 0; z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 28px; height: 28px; background: #0052CC; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.header-title { font-size: 16px; font-weight: 600; color: #172B4D; }
.header-date  { font-size: 12px; color: #6B778C; }
.header-right { display: flex; align-items: center; gap: 10px; }
.toggle-label {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: #6B778C; cursor: pointer; user-select: none;
}
.toggle-label input { cursor: pointer; accent-color: #0052CC; }
.btn-header {
  background: #F4F5F7; border: 1px solid #DFE1E6; border-radius: 4px;
  padding: 5px 10px; font-size: 12px; color: #5E6C84; cursor: pointer;
  font-family: inherit;
}
.btn-header:hover { background: #EBECF0; }

/* ── LAYOUT ── */
.board { display: flex; flex: 1; overflow: hidden; }
.panel {
  display: flex; flex-direction: column;
  overflow: hidden; padding: 14px 0 14px 14px;
}
.panel-left  { flex: 0 0 57%; border-right: 2px solid #DFE1E6; }
.panel-right { flex: 1; }
.panel-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; padding-right: 14px; flex-shrink: 0;
}
.panel-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-blue   { background: #0052CC; }
.dot-purple { background: #6554C0; }
.panel-label {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: #6B778C;
}

/* ── TRACK ── */
.track {
  display: flex; gap: 10px; overflow-x: auto;
  padding-bottom: 10px; flex: 1; align-items: flex-start; padding-right: 14px;
}
.track::-webkit-scrollbar { height: 5px; }
.track::-webkit-scrollbar-thumb { background: #C1C7D0; border-radius: 3px; }

/* ── COLUMN ── */
.col {
  background: #F4F5F7; border-radius: 8px; padding: 10px 8px;
  display: flex; flex-direction: column; gap: 6px;
  max-height: calc(100vh - 118px); overflow-y: auto; transition: background .1s;
}
.panel-left  .col { flex: 0 0 168px; }
.panel-right .col { flex: 0 0 150px; }
.col::-webkit-scrollbar { width: 3px; }
.col::-webkit-scrollbar-thumb { background: #C1C7D0; border-radius: 2px; }
.col.drag-over { background: #E6EFFF; }
.col-header {
  font-size: 12px; font-weight: 700; color: #5E6C84; letter-spacing: .04em;
  padding: 2px 4px 6px; display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.col-count { font-size: 11px; color: #97A0AF; font-weight: 400; margin-left: auto; }
.person-chip {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: #fff;
}

/* ── CARD ── */
.card {
  background: #fff; border-radius: 6px; padding: 8px 10px;
  font-size: 12.5px; line-height: 1.4; color: #172B4D;
  box-shadow: 0 1px 3px rgba(9,30,66,.10), 0 0 0 1px rgba(9,30,66,.04);
  border-left: 3px solid transparent; position: relative;
  cursor: default; transition: box-shadow .12s; word-break: break-word; flex-shrink: 0;
}
.card:hover    { box-shadow: 0 3px 8px rgba(9,30,66,.14), 0 0 0 1px rgba(9,30,66,.08); }
.card.urgent   { border-left-color: #FF5630; }
.card.done     { opacity: .42; }
.card.done .card-text { text-decoration: line-through; }
.card.editing  { box-shadow: 0 0 0 2px #4C9AFF; }
.card.dragging { opacity: .3; }
.card-text {
  display: block; white-space: pre-wrap; outline: none; min-height: 1em; padding-right: 2px;
}
.card-owner {
  display: inline-block; margin-top: 5px;
  font-size: 10px; font-weight: 600; color: #6B778C;
  background: #F4F5F7; border-radius: 3px; padding: 1px 5px;
}
.type-badge {
  display: inline-flex; align-items: center;
  font-size: 10px; font-weight: 600; letter-spacing: .02em;
  border-radius: 3px; padding: 1px 6px; margin-top: 5px; margin-left: 3px;
  cursor: pointer; user-select: none; transition: opacity .12s;
}
.type-badge:hover { opacity: .7; }
.type-badge.todo    { background: #DEEBFF; color: #0052CC; }
.type-badge.monitor { background: #FFF0B3; color: #974F0C; }

/* action buttons */
.card-actions {
  position: absolute; top: 4px; right: 4px; display: none; gap: 2px; align-items: center;
}
.card:hover .card-actions,
.card.editing .card-actions { display: flex; }
.act {
  width: 20px; height: 20px; border: none; border-radius: 3px; cursor: pointer;
  font-size: 11px; font-weight: 700; display: flex; align-items: center;
  justify-content: center; font-family: inherit; line-height: 1;
  background: rgba(255,255,255,.92); color: #6B778C; flex-shrink: 0;
}
.act:hover        { background: #EBECF0; color: #172B4D; }
.act.urgent       { color: #FF5630; }
.act.urgent:hover { background: #FFEBE6; }
.act.done         { color: #36B37E; }
.act.done:hover   { background: #E3FCEF; }
.act.del:hover    { background: #FFEBE6; color: #FF5630; }
.drop-line {
  height: 3px; background: #4C9AFF; border-radius: 2px; flex-shrink: 0; pointer-events: none;
}
.btn-add {
  background: none; border: none; cursor: pointer; font-size: 12px; color: #97A0AF;
  padding: 4px 6px; border-radius: 4px; text-align: left; width: 100%;
  font-family: inherit; flex-shrink: 0; display: flex; align-items: center; gap: 4px;
}
.btn-add:hover { background: rgba(9,30,66,.06); color: #5E6C84; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">W</div>
    <span class="header-title">Work Board</span>
    <span class="header-date" id="hdr-date"></span>
  </div>
  <div class="header-right">
    <label class="toggle-label">
      <input type="checkbox" id="toggle-done" checked> Show done
    </label>
    <button class="btn-header" onclick="exportJSON()">Export JSON</button>
    <button class="btn-header" onclick="resetBoard()" style="color:#FF5630">Reset</button>
  </div>
</div>

<div class="board">
  <div class="panel panel-left">
    <div class="panel-header">

    </div>

}

// ── STATE ─────────────────────────────────────────────────────────────────────
const LS = 'workboard_v1';
let state = (() => {
  try { const r = localStorage.getItem(LS); return r ? JSON.parse(r) : defaultState(); }
  catch { return defaultState(); }
})();
let showDone = true;
let drag = null;

function save() { localStorage.setItem(LS, JSON.stringify(state)); }

function resetBoard() {
  if (!confirm('Reset board to default data? This cannot be undone.')) return;
  state = defaultState(); save(); renderAll();
}

// ── LOOKUPS ───────────────────────────────────────────────────────────────────
function col(p, cId)       { return state[p]?.find(c => c.id === cId); }
function card(p, cId, dId) { return col(p, cId)?.cards.find(c => c.id === dId); }

// ── MUTATIONS ─────────────────────────────────────────────────────────────────
function addCard(p, cId) {
  const c = { id: uid(), text: '', owner: '', urgent: false, done: false, type: 'todo' };
  col(p, cId).cards.push(c); save(); reRenderCol(p, cId);
  requestAnimationFrame(() => { const el = document.getElementById('ct-' + c.id); if (el) startEdit(el); });
}

function deleteCard(p, cId, dId) {
  const c = col(p, cId); c.cards = c.cards.filter(x => x.id !== dId); save(); reRenderCol(p, cId);
}

function toggleDone(p, cId, dId) {
  const c = card(p, cId, dId); if (!c) return;
  c.done = !c.done; save(); syncCardEl(p, cId, dId); updateCount(p, cId);
}

function toggleUrgent(p, cId, dId) {
  const c = card(p, cId, dId); if (!c) return;
  c.urgent = !c.urgent; save(); syncCardEl(p, cId, dId);
}

function toggleType(p, cId, dId) {
  const c = card(p, cId, dId); if (!c) return;
  c.type = (c.type || 'todo') === 'todo' ? 'monitor' : 'todo'; save();
  const badge = document.querySelector('#card-' + dId + ' .type-badge');
  if (badge) { badge.className = 'type-badge ' + c.type; badge.textContent = c.type === 'monitor' ? 'Monitor' : 'To Do'; }
}

function commitText(p, cId, dId, raw) {
  const text = raw.trim(); const c = card(p, cId, dId); if (!c) return;
  if (!text) { deleteCard(p, cId, dId); return; }
  c.text = text; save();
}

// ── DOM SYNC ──────────────────────────────────────────────────────────────────
function syncCardEl(p, cId, dId) {
  const c = card(p, cId, dId); const el = document.getElementById('card-' + dId);
  if (!c || !el) return;
  el.classList.toggle('urgent', c.urgent); el.classList.toggle('done', c.done);
  el.querySelector('.act.urgent').style.opacity = c.urgent ? '1' : '';
  el.querySelector('.act.done').style.opacity   = c.done   ? '1' : '';
  if (!showDone && c.done) el.style.display = 'none';
}

function updateCount(p, cId) {
  const c = col(p, cId); if (!c) return;
  const el = document.querySelector('#col-' + cId + ' .col-count');
  if (el) el.textContent = c.cards.filter(x => showDone || !x.done).length;
}

function reRenderCol(p, cId) {
  const c = col(p, cId); if (!c) return;
  const track = document.getElementById('track-' + p);
  const old   = document.getElementById('col-' + cId);
  const fresh = buildCol(p, c);
  if (old) track.replaceChild(fresh, old); else track.appendChild(fresh);
}

// ── EDIT ──────────────────────────────────────────────────────────────────────
function startEdit(el) {
  el.contentEditable = 'true'; el.focus();
  el.closest('.card').classList.add('editing');
  const r = document.createRange(), s = window.getSelection();
  r.selectNodeContents(el); r.collapse(false); s.removeAllRanges(); s.addRange(r);
}
function stopEdit(el) {
  el.contentEditable = 'false'; el.closest('.card')?.classList.remove('editing');
}

// ── BUILD CARD ────────────────────────────────────────────────────────────────
function buildCard(p, cId, c) {
  const div = document.createElement('div');
  div.className = 'card' + (c.urgent ? ' urgent' : '') + (c.done ? ' done' : '');
  div.id = 'card-' + c.id;
  if (!showDone && c.done) div.style.display = 'none';

  div.draggable = true;
  div.addEventListener('dragstart', e => {
    drag = { p, cId, cardId: c.id }; e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => div.classList.add('dragging'), 0);
  });
  div.addEventListener('dragend', () => {
    div.classList.remove('dragging');
    document.querySelectorAll('.drop-line').forEach(x => x.remove()); drag = null;
  });
  div.addEventListener('dragover', e => {
    if (!drag) return; e.preventDefault(); e.stopPropagation();
    document.querySelectorAll('.drop-line').forEach(x => x.remove());
    const line = document.createElement('div'); line.className = 'drop-line';
    const mid  = div.getBoundingClientRect().top + div.getBoundingClientRect().height / 2;
    div.parentNode.insertBefore(line, e.clientY < mid ? div : div.nextSibling);
  });
  div.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    document.querySelectorAll('.drop-line').forEach(x => x.remove());
    if (!drag || drag.cardId === c.id) return;
    const mid = div.getBoundingClientRect().top + div.getBoundingClientRect().height / 2;
    moveCard(drag.p, drag.cId, drag.cardId, p, cId, c.id, e.clientY < mid);
  });

  const actions = document.createElement('div'); actions.className = 'card-actions';
  const urgBtn = document.createElement('button');
  urgBtn.className = 'act urgent'; urgBtn.title = 'Toggle urgent'; urgBtn.textContent = '!';
  urgBtn.style.opacity = c.urgent ? '1' : '';
  urgBtn.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); toggleUrgent(p, cId, c.id); });
  actions.appendChild(urgBtn);

  const doneBtn = document.createElement('button');
  doneBtn.className = 'act done'; doneBtn.title = 'Toggle done'; doneBtn.textContent = '✓';
  doneBtn.style.opacity = c.done ? '1' : '';
  doneBtn.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); toggleDone(p, cId, c.id); });
  actions.appendChild(doneBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'act del'; delBtn.title = 'Delete'; delBtn.textContent = '×';
  delBtn.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); deleteCard(p, cId, c.id); });
  actions.appendChild(delBtn);
  div.appendChild(actions);

  const textEl = document.createElement('div');
  textEl.className = 'card-text'; textEl.id = 'ct-' + c.id;
  textEl.textContent = c.text; textEl.contentEditable = 'false';
  textEl.addEventListener('click', e => { if (textEl.contentEditable !== 'true') { startEdit(textEl); e.stopPropagation(); } });
  textEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') { textEl.textContent = c.text; textEl.blur(); }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); textEl.blur(); }
  });
  textEl.addEventListener('blur', () => { stopEdit(textEl); commitText(p, cId, c.id, textEl.textContent); });
  div.appendChild(textEl);

  if (c.owner) {
    const own = document.createElement('span');
    own.className = 'card-owner'; own.textContent = c.owner; div.appendChild(own);
  }

  const type = c.type || 'todo';
  const badge = document.createElement('span');
  badge.className = 'type-badge ' + type;
  badge.textContent = type === 'monitor' ? 'Monitor' : 'To Do';
  badge.addEventListener('click', e => { e.stopPropagation(); toggleType(p, cId, c.id); });
  div.appendChild(badge);

  return div;
}

// ── BUILD COLUMN ──────────────────────────────────────────────────────────────
function buildCol(p, c) {
  const div = document.createElement('div');
  div.className = 'col'; div.id = 'col-' + c.id;

  div.addEventListener('dragover', e => { if (!drag) return; e.preventDefault(); div.classList.add('drag-over'); });
  div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
  div.addEventListener('drop', e => {
    e.preventDefault(); div.classList.remove('drag-over');
    document.querySelectorAll('.drop-line').forEach(x => x.remove());
    if (!drag) return;
    moveCard(drag.p, drag.cId, drag.cardId, p, c.id, null, false);
  });

  const hdr = document.createElement('div'); hdr.className = 'col-header';
  if (c.initials) {
    const chip = document.createElement('span'); chip.className = 'person-chip';
    chip.style.background = c.color || '#97A0AF'; chip.textContent = c.initials;
    hdr.appendChild(chip);
  }
  const titleEl = document.createElement('span'); titleEl.textContent = c.title; hdr.appendChild(titleEl);
  const countEl = document.createElement('span'); countEl.className = 'col-count';
  countEl.textContent = c.cards.filter(x => showDone || !x.done).length; hdr.appendChild(countEl);
  div.appendChild(hdr);

  c.cards.forEach(cd => div.appendChild(buildCard(p, c.id, cd)));

  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add'; addBtn.innerHTML = '＋ Add card';
  addBtn.addEventListener('click', () => addCard(p, c.id));
  div.appendChild(addBtn);

  return div;
}

// ── DRAG MOVE ─────────────────────────────────────────────────────────────────
function moveCard(sp, scId, cardId, dp, dcId, anchorId, before) {
  const srcCol = col(sp, scId); const dstCol = col(dp, dcId);
  if (!srcCol || !dstCol) return;
  const moved = srcCol.cards.find(c => c.id === cardId); if (!moved) return;
  srcCol.cards = srcCol.cards.filter(c => c.id !== cardId);
  let idx = anchorId ? dstCol.cards.findIndex(c => c.id === anchorId) : -1;
  if (idx === -1) idx = dstCol.cards.length; else if (!before) idx++;
  dstCol.cards.splice(idx, 0, moved); save();
  reRenderCol(dp, dcId);
  if (!(sp === dp && scId === dcId)) reRenderCol(sp, scId);
  drag = null;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderAll() {
  ['myAreas', 'syncAgendas'].forEach(p => {
    const track = document.getElementById('track-' + p);
    track.innerHTML = '';
    (state[p] || []).forEach(c => track.appendChild(buildCol(p, c)));
  });
}

// ── EXPORT ────────────────────────────────────────────────────────────────────
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'workboard.json' });
  a.click(); URL.revokeObjectURL(a.href);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.getElementById('hdr-date').textContent = new Date().toLocaleDateString('en-US', {
  weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
});
document.getElementById('toggle-done').addEventListener('change', function() {
  showDone = this.checked; renderAll();
});
renderAll();
</script>
